; EscoEditor - more control for the Rockstar Editor (standalone .asi).
; Keys are Windows virtual-key codes, decimal or 0x hex:
;   https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
; An inline "; comment" after a number is fine. The menu writes these keys too.

[EscoEditor]
Speed=100            ; % of the game's free camera speed (100 = the stock 10 m/s). 5..1000
VerticalSpeed=0      ; % for Page Up / Page Down. 0 = same as Speed
LookSpeed=100        ; % of the stock turn (look) speed, stick and mouse
Response=1           ; 0 stock ramp, 1 ramp scales with the speed, 2 instant start/stop
MenuRows=1           ; 1 = the EscoEditor rows in the editor's marker menu, 0 = keys only
MenuPage=1           ; page EscoEditor opens on: 0 closed, 1 Camera Speed, 2 Copy & Paste, 3 Time & Weather, 4 Lights
Scene=1              ; 1 = Time of Day / Weather rows, 0 = off
Lights=1             ; 1 = scene lights in the Rockstar Editor, placed in the light editor (its window needs ReShade with add-on support)
EnbDof=0             ; 1 = ENB draws the Rockstar Editor's depth of field (ENB with its SDK, EnableDepthOfField=true)
EnbDofFollowGame=0   ; 1 = a Custom keyframe's Focal Distance and Intensity also drive ENB (the ENB rows still win)
EnbDofStrength=1.0   ; times the ENB aperture a Custom keyframe's intensity gives (1 = 100% is NVE's own 0.5)
LightsAllClips=0     ; 1 = the lights of one clip are the lights of every clip of that project
KeyFreeLook=0x4B    ; K - Free Look on/off: fly without changing this keyframe's camera
KeyLights=0x4C       ; L - opens / closes the light editor inside a clip (the Lights page of the menu changes it)
Hotkeys=2            ; 0 off, 1 step keys, 2 step + hold keys, 3 step + hold + mouse wheel
KeySlower=0x46       ; F      - one preset slower
KeyFaster=0x47       ; G      - one preset faster
KeyReset=0x30        ; 0      - back to 100%
KeyBoost=0xA0        ; Left Shift - hold for BoostMul x
BoostMul=3
KeySlow=0xA4         ; Left Alt   - hold for SlowMul x
SlowMul=0.25
HotkeysAnywhere=0    ; 1 = keys also count in the editor menus, not only in Edit Camera
Log=1                ; write EscoEditor.log next to the .asi

[Keyframes]
; The keyframe clipboard (Count, M1 .. M32), written by Copy / Cut in the editor.

[DepthOfField]
; Clip = the copied Depth of Field (mode, focus mode, distance, intensity), written by Copy DOF.
